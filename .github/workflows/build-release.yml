name: Build Price Compare Assistant ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'price-compare-assistant.php'
      - 'assets/**'
      - 'README.md'
      - 'readme.txt'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(grep 'Version:' price-compare-assistant.php | head -1 | sed 's/.*Version:[[:space:]]*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        run: php -l price-compare-assistant.php

      - name: Build ZIP
        shell: bash
        run: |
          rm -rf dist build
          mkdir -p dist build/price-compare-assistant
          cp price-compare-assistant.php build/price-compare-assistant/
          [ -f README.md ] && cp README.md build/price-compare-assistant/ || true
          [ -f readme.txt ] && cp readme.txt build/price-compare-assistant/ || true
          [ -d assets ] && cp -R assets build/price-compare-assistant/ || true
          cd build
          zip -qr ../dist/price-compare-assistant.zip price-compare-assistant

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-compare-assistant-v${{ steps.version.outputs.version }}
          path: dist/price-compare-assistant.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="price-compare-assistant-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/price-compare-assistant.zip --clobber
          else
            gh release create "$TAG" dist/price-compare-assistant.zip --title "Price Compare Assistant v${VERSION}" --notes "Installable WordPress ZIP for Price Compare Assistant v${VERSION}."
          fi
